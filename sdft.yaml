paths:
  model_path: "model/Qwen3-VL-2B-Instruct" # model/Qwen3-VL-4B-Instruct or model/Qwen3-VL-2B-Instruct
  output_dir: "checkpoints"
  # Set this to the Stage1 best-val_dist checkpoint before running Stage2.
  checkpoint_dir: "checkpoints/SFT_direct"
  image_root: "data/gazefollow_extended/train"
  train_ann: "data/gazefollow/train_annotations_new.txt"
  val_ann: "data/gazefollow/val_annotations_new.txt"
  test_ann: "data/gazefollow_extended/test_annotations_release.txt"
  test_image_root: "data/gazefollow_extended/test2"
  train_labels: "data/gazefollow/gaze-labels-train.csv"
  val_labels: "data/gazefollow/gaze-labels-val.csv"
  test_labels: "data/gazefollow/gaze-labels-test.csv"
  labels_rgs: "data/gazefollow/gaze-labels-rgs.csv"
  labels_ssa: "data/gazefollow/gaze-labels-ssa.csv"
  vocab2id: "data/gazefollow/vocab2id.json"
  train_reasoning_dir: "/home/work/jinwoong/QWEN_GazeEstimation/data/gazefollow_reason_train"

data:
  image_resize_mode: "fixed"  # "native" | "fixed"
  scene_h: 512
  scene_w: 512
  image_cache_size: 1000
  split_prefix: "train/"
  strip_split_prefix: true
  test_split_prefix: "test2/"
  test_strip_split_prefix: true
  test_bbox_round_decimals: 3

train:
  train_stage: "sdft"
  seed: 42
  device: "cuda"
  dtype: "bfloat16"
  gradient_checkpointing: false
  epochs: 2
  batch_size: 32
  grad_accum_steps: 8
  num_workers: 8
  lr: 2e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  filter_invalid_object_samples: false
  train_augmentation_mode_direct: "crop_only"  # "full" | "no_crop" | "color_only" | "crop_only" | "no_aug"
  save_last_every_n_epochs: 1

eval:
  test_batch_size: 32
  eval_only: false
  test_only: false
  run_val_metrics: true
  run_val_metrics_every_n_epochs: 1
  checkpoint_monitor: "val_dist"
  checkpoint_monitor_mode: "min"
  generation_max_new_tokens: 8
  constrained_decoding: true
  constrained_loc_decoding: "round_expectation"  # "argmax" | "round_expectation"

prompt:
  visual_prompting: true
  prompt_text_direct: |
    Given the image and head box <|box_start|>({loc_x1},{loc_y1}),({loc_x2},{loc_y2})<|box_end|>,
    predict the gaze point and target.
    Return only: <|point_start|>{loc_tok_min}~{loc_tok_max}{loc_tok_min}~{loc_tok_max}<|point_end|><|object_start|>{obj_tok_min}~{obj_tok_max}<|object_end|>
  prompt_text_teacher: |
    Given the image and head box <|box_start|>({loc_x1},{loc_y1}),({loc_x2},{loc_y2})<|box_end|>,
    predict the gaze point and target.

model:
  coord_bins: 128
  attn_implementation: "flash_attention_2"
  max_text_length: 512
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_bias: "none"
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

loss:
  loss_point_weight: 3.0
  loss_object_weight: 1.0
  loss_format_weight: 1.0
  gaussian_point_sigma: 3.0

distil:
  # Stage2 SDFT: student sees the point-object prompt; teacher receives an auxiliary reasoning demonstration.
  distil_kl_weight: 0.5
  distil_temperature: 2.0
  distil_teacher_eval_mode: true
  teacher_update: "ema" 
  teacher_ema_decay: 0.999
  teacher_suffix: |

    Use the following reasoning to guide your prediction: {reasoning_text}
    The object at the gaze point appears to be {object_text}.

    Now apply the same reasoning process to predict the gaze point and target.
    Return only: <|point_start|>{loc_tok_min}~{loc_tok_max}{loc_tok_min}~{loc_tok_max}<|point_end|><|object_start|>{obj_tok_min}~{obj_tok_max}<|object_end|>

sdft:
  # Mode selection: teacher_forcing (current) or rollout (on-policy SDFT).
  sdft_mode: rollout   # choices: teacher_forcing, rollout

  # rollout mode: optional weak CE on GT target (paper-core is KL only, ce_weight=0.0).
  sdft_ce_weight: 0.3

  # Rollout generation parameters (rollout mode only).
  rollout_max_new_tokens: 8
  rollout_do_sample: false
  rollout_temperature: 1.0  # no work if do_sample=false
  rollout_top_p: 1.0  # no work if do_sample=false 
  rollout_constrained_decoding: true
  rollout_constrained_loc_decoding: "round_expectation"  # "argmax" | "round_expectation"

  # Rollout validity filtering.
  skip_invalid_rollouts: true
  skip_truncated_rollouts: true

  # KL application scope.
  kl_on_point: true
  kl_on_object: true
  kl_on_format: false

wandb:
  enabled: true
  project: "VLM_gaze"
  entity: "semgaze"
  run_name: "SDFT_direct_expectation"
  wandb_log_every_steps: 20
  tags: ["sdft"]
  notes: "Stage2 point-object self-distillation with teacher-side reasoning demonstrations from Stage1 best val_dist checkpoint."
