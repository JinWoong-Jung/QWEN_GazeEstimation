paths:
  model_path: "model/Qwen3-VL-2B-Instruct" # model/Qwen3-VL-4B-Instruct or model/Qwen3-VL-2B-Instruct
  output_dir: "checkpoints"
  image_root: "data/gazefollow_extended/train"
  train_ann: "data/gazefollow/train_annotations_new.txt"
  val_ann: "data/gazefollow/val_annotations_new.txt"
  test_ann: "data/gazefollow_extended/test_annotations_release.txt"
  test_image_root: "data/gazefollow_extended/test2"
  train_labels: "data/gazefollow/gaze-labels-train.csv"
  val_labels: "data/gazefollow/gaze-labels-val.csv"
  test_labels: "data/gazefollow/gaze-labels-test.csv"
  labels_rgs: "data/gazefollow/gaze-labels-rgs.csv"
  labels_ssa: "data/gazefollow/gaze-labels-ssa.csv"
  vocab2id: "data/gazefollow/vocab2id.json"
  train_reasoning_dir: "/home/elicer/QWEN_GazeEstimation/data/bucket_data/data/gazefollow_reason/output/train"

data:
  image_resize_mode: "fixed"  # "native" | "fixed"
  scene_h: 512
  scene_w: 512
  image_cache_size: 1000
  split_prefix: "train/"
  strip_split_prefix: true
  test_split_prefix: "test2/"
  test_strip_split_prefix: true
  test_bbox_round_decimals: 3

train:
  seed: 42
  device: "cuda"
  dtype: "bfloat16"
  gradient_checkpointing: false
  epochs: 20
  batch_size: 16
  grad_accum_steps: 8
  num_workers: 8
  lr: 1e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  filter_invalid_object_samples: false
  train_augmentation_mode: "full"  # "full" | "color_only" | "no_crop" | "no_aug"
  save_last_every_n_epochs: 5
  use_reasoning: false
  reasoning_view_ratio: 0.2   # ratio of total records to use as reasoning_only views

reasoning:
  max_reasoning_words: 60
  max_reasoning_chars: 500

eval:
  test_batch_size: 16
  show_tqdm: true
  eval_only: false
  test_only: false
  run_test: true
  run_val_metrics: true
  run_val_metrics_every_n_epochs: 1
  checkpoint_monitor: "val_dist"      # val_dist | val_object_acc | val_format_valid
  checkpoint_monitor_mode: "min"     # auto | min | max
  generation_max_new_tokens: 5       # point_object fallback (constrained path ignores this; free path: exactly 5 tokens)
  generation_num_beams: 1
  repetition_penalty: 1.0
  no_repeat_ngram_size: 0
  generation_stop_at_object_end: true
  constrained_decoding: true
  constrained_target_order: "point_object"
  constrained_loc_decoding: "argmax"  # "argmax" | "round_expectation"

prompt:
  visual_prompting: true
  # point_object prompt: used for all training views and evaluation
  prompt_text_direct: |
    The head box [{loc_x1}{loc_y1}{loc_x2}{loc_y2}] marks the person.
    Output the gaze point(coordinate tokens) and object(object token).
    Coordinate tokens follow image coordinates:
    for x, <loc_{coord_min:03d}> is the left edge and <loc_{coord_max:03d}> is the right edge;
    for y, <loc_{coord_min:03d}> is the top edge and <loc_{coord_max:03d}> is the bottom edge.
    Use exactly one object token in the range <obj_{obj_min:03d}> to <obj_{obj_max:03d}>.
    Return exactly this schema:
    <|gaze_point|><loc_NNN><loc_MMM><|gaze_object|><obj_KKK>
  # reasoning_only prompt: used only for reasoning_only training views
  prompt_text_reasoning: |
    The head box [{loc_x1}{loc_y1}{loc_x2}{loc_y2}] marks the person.
    In one or two short sentences, reason about where this person is looking and what they are gazing at.
    Return exactly this schema:
    <|gaze_reasoning|><your reasoning here>

model:
  coord_bins: 128
  attn_implementation: "sdpa"
  max_text_length: 512
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_bias: "none"
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

loss:
  loss_point_weight: 3.0
  loss_object_weight: 1.0
  loss_format_weight: 0.2
  loss_reasoning_weight: 0.1
  gaussian_point_sigma: 3.0   # Gaussian soft-label CE sigma (bins). 0.0 = hard CE.

wandb:
  enabled: true
  project: "VLM_gaze"
  entity: "semgaze"
  run_name: "reasoning_SFT_v2"
  wandb_log_every_steps: 20
  tags: []
  notes: ""
