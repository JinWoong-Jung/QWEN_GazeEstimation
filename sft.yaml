paths:
  model_path: "model/Qwen3-VL-2B-Instruct" # model/Qwen3-VL-4B-Instruct or model/Qwen3-VL-2B-Instruct
  output_dir: "checkpoints"
  image_root: "data/gazefollow_extended/train"
  train_ann: "data/gazefollow/train_annotations_new.txt"
  val_ann: "data/gazefollow/val_annotations_new.txt"
  test_ann: "data/gazefollow_extended/test_annotations_release.txt"
  test_image_root: "data/gazefollow_extended/test2"
  train_labels: "data/gazefollow/gaze-labels-train.csv"
  val_labels: "data/gazefollow/gaze-labels-val.csv"
  test_labels: "data/gazefollow/gaze-labels-test.csv"
  labels_rgs: "data/gazefollow/gaze-labels-rgs.csv"
  labels_ssa: "data/gazefollow/gaze-labels-ssa.csv"
  vocab2id: "data/gazefollow/vocab2id.json"
  train_reasoning_dir: "data/bucket_data/data/gazefollow_reason/output/train"

data:
  image_resize_mode: "fixed"  # "native" | "fixed"
  scene_h: 512
  scene_w: 512
  min_pixels: 12544
  max_pixels: 524288   # 2560 * 28 * 28 / 4 ≈ 512-tile budget
  image_cache_size: 1000
  split_prefix: "train/"
  strip_split_prefix: true
  test_split_prefix: "test2/"
  test_strip_split_prefix: true
  test_bbox_round_decimals: 3

train:
  seed: 42
  device: "cuda"
  dtype: "bfloat16"
  gradient_checkpointing: false
  epochs: 20
  batch_size: 16
  grad_accum_steps: 8
  num_workers: 8
  lr: 1e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  filter_invalid_object_samples: false
  save_last_every_n_epochs: 5
  use_reasoning: true

reasoning:
  target_order: "reasoning_object_point"   # object_point | point_object | point_object_reasoning | reasoning_object_point
  force_reasoning_format_train: true        # force <think> scaffold even when no reasoning file
  force_reasoning_format_eval: false        # do NOT force empty scaffold on val/test
  disable_spatial_aug_for_reasoning: true   # skip hflip/crop for samples with reasoning files

eval:
  test_batch_size: 16
  show_tqdm: true
  eval_only: false
  test_only: false
  run_test: true
  run_val_metrics: true
  run_val_metrics_every_n_epochs: 1
  checkpoint_monitor: "val_dist"      # val_loss | val_dist | val_object_acc | val_joint_exact | val_format_valid
  checkpoint_monitor_mode: "min"     # auto | min | max
  generation_max_new_tokens: 128      # reasoning_object_point: ~15-50 reasoning + ~10 answer tokens
  generation_num_beams: 1
  repetition_penalty: 1.0
  no_repeat_ngram_size: 0
  generation_stop_at_object_end: false  # stop at natural EOS; reasoning_object_point needs full output

prompt:
  visual_prompting: true
  prompt_template: ""
  # Used when use_reasoning=true (reasoning_object_point target order)
  prompt_text: |
    The head box [{loc_x1}{loc_y1}{loc_x2}{loc_y2}] marks the person.
    Briefly reason about where this person is looking, then output the object and gaze point.
    Use exactly one x-bin and one y-bin token, each in the range <loc_{coord_min:03d}> to <loc_{coord_max:03d}>.
    Use exactly one object token in the range <obj_{obj_min:03d}> to <obj_{obj_max:03d}>.
    Return exactly:
    <think>
    Reasoning: <your reasoning here>
    </think>
    Object: <obj_KKK>
    Point: <loc_NNN><loc_MMM>
  # Used when use_reasoning=false (object_point target order, no <think> block)
  prompt_text_direct: |
    The head box [{loc_x1}{loc_y1}{loc_x2}{loc_y2}] marks the person.
    Predict the gaze point and the object at that point.
    Use exactly one x-bin and one y-bin token, each in the range <loc_{coord_min:03d}> to <loc_{coord_max:03d}>.
    Use exactly one object token in the range <obj_{obj_min:03d}> to <obj_{obj_max:03d}>.
    Return exactly:
    Object: <obj_KKK>
    Point: <loc_NNN><loc_MMM>

model:
  coord_bins: 128
  attn_implementation: "sdpa"
  max_text_length: 512
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_bias: "none"
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

loss:
  loss_point_weight: 2.0
  loss_object_weight: 1.0
  loss_format_weight: 0.5
  loss_reasoning_weight: 0.5

wandb:
  enabled: true
  project: "VLM_gaze"
  entity: "semgaze"
  run_name: "1_reasoning_SFT"
  wandb_log_every_steps: 20
  tags: []
  notes: ""
