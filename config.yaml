run:
  mode: "train"  # train | infer

model:
  repo_id: "Qwen/Qwen3-VL-4B-Instruct"
  local_model_dir: ""
  model_name: "qwen3vl-gazefollow-lora"
  trust_remote_code: true
  torch_dtype: "bfloat16"  # auto | float16 | bfloat16 | float32
  device: "cuda"  # auto | cpu | cuda | mps
  download_if_missing: true
  processor_kwargs:
    min_pixels: 262144
    max_pixels: 786432
  model_kwargs: {}
  # VRAM이 부족하면 아래처럼 사용:
  # model_kwargs:
  #   load_in_4bit: true
  #   device_map: "auto"

data_paths:
  train_images_dir: "/home/elicer/QWEN_GazeEstimation/data/gazefollow_extended/train"
  val_images_dir: "/home/elicer/QWEN_GazeEstimation/data/gazefollow_extended/train"
  test_images_dir: "/home/elicer/QWEN_GazeEstimation/data/gazefollow_extended/test2"
  test_annotation_file: "/home/elicer/QWEN_GazeEstimation/data/gazefollow_extended/test_annotations_release.txt"

input:
  # train + infer 공통
  use_image: true
  use_head_crop: true
  strict_head_bbox: true

  # infer 전용
  mode: "batch"  # batch | single
  image_dir: "100_imgs"
  prompt_dir: "100_imgs_prompt"
  image_extensions: [".jpg", ".jpeg", ".png", ".webp", ".bmp"]
  image_path: ""
  prompt_path: ""
  prompt_text: ""

prompt:
  use_chat_template: true
  add_generation_prompt: true
  head_crop_context_text: "Image 1 is the full scene. Image 2 is the cropped head of the target subject."
  append_numeric_instruction: true
  numeric_instruction: |
    Return only two integers in one line.
    Format: ix iy
    Each value must be in [0, 999].
    No explanation. No labels. No extra text.
  train_prompt_template: ""

generation:
  # infer/test 생성 옵션
  max_new_tokens: 16
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  extra_kwargs: {}

train:
  target_format: "xy_bins"  # xy_bins | xy_float
  coord_bins: 1000
  target_decimals: 6
  max_seq_length: 2048
  resume_from_checkpoint: ""

  dataset:
    train_annotation_file: "data/gazefollow/train_annotations_new.txt"
    val_annotation_file: "data/gazefollow/val_annotations_new.txt"
    train_split_prefix: "train/"
    val_split_prefix: "train/"
    strip_split_prefix: true
    skip_outside_frame: true
    max_train_samples: 30000
    max_val_samples: 1000
    show_loading_tqdm: true

  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    bias: "none"
    task_type: "CAUSAL_LM"
    freeze_vision: true
    vision_freeze_patterns:
      - "visual"
      - "vision"
      - "vision_tower"
      - "image_tower"
      - "visual_encoder"
      - "vit"
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    # 확장 실험 시:
    # target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

  optimizer:
    learning_rate: 1e-4
    weight_decay: 0
    warmup_ratio: 0.03
    lr_scheduler_type: "cosine"
    max_grad_norm: 1.0

  trainer:
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 4
    num_train_epochs: 1
    max_steps: -1
    gradient_checkpointing: true
    dataloader_num_workers: 2
    bf16: true
    fp16: false
    logging_steps: 20
    save_strategy: "steps"
    save_steps: 1000
    save_total_limit: 3
    evaluation_strategy: "no"
    eval_steps: 0
    save_safetensors: true
    report_to: "none"
    disable_tqdm: false

  output:
    checkpoints_subdir: ""
    run_name: "qwen3vl_gazefollow_lora"
    save_merged_model: true
    merged_model_subdir: "merged_model"

  wandb:
    enabled: true
    project: "gaze_mllm"
    entity: "semgaze"
    name: "qwen3vl-gazefollow-lora"
    tags: []
    notes: ""

  test_eval:
    enabled: true
    annotation_file: "/home/elicer/QWEN_GazeEstimation/data/gazefollow_extended/test_annotations_release.txt"
    images_dir: "/home/elicer/QWEN_GazeEstimation/data/gazefollow_extended/test2"
    split_prefix: "test2/"
    strip_split_prefix: true
    batch_size: 8
    max_samples: 1000  # 전체는 0
    show_tqdm: true
    group_mode: "auto"  # auto | image | image_bbox
    bbox_round_decimals: 3
    fail_on_no_valid_predictions: false

inference:
  # 비우면 train 산출물 기준 자동 탐색
  model_dir: ""
  merged_model_dir: ""
  adapter_dir: ""
  base_model_dir: ""
  use_train_artifacts: true
  prefer_merged_model: true
  allow_adapter_fallback: true

output:
  # infer 전용 output
  root_dir: "100_imgs_output"
  overwrite: true
  prefer_parsed_output: true
  parsed_output_decimals: 6

evaluation:
  # infer 후 txt 기반 평가
  run_after_generation: true
  gt_dir: "100_imgs_target"
  save_json: ""
