paths:
  model_path: "model/Qwen3-VL-4B-Instruct"
  image_root: "data/gazefollow_extended/train"
  train_ann: "data/gazefollow/train_annotations_new.txt"
  val_ann: "data/gazefollow/val_annotations_new.txt"
  test_ann: "data/gazefollow_extended/test_annotations_release.txt"
  test_image_root: "data/gazefollow_extended/test2"
  train_labels: "data/gazefollow/gaze-labels-train.csv"
  val_labels: "data/gazefollow/gaze-labels-val.csv"
  test_labels: "data/gazefollow/gaze-labels-test.csv"
  labels_rgs: "data/gazefollow/gaze-labels-rgs.csv"
  labels_ssa: "data/gazefollow/gaze-labels-ssa.csv"
  vocab2id: "data/gazefollow/vocab2id.json"
  label_embed_dir: "data/gazefollow/label-embeds"
  output_dir: "checkpoints/qwen_ge"

data:
  split_prefix: "train/"
  strip_split_prefix: true
  max_train_samples: 0
  max_val_samples: 0
  max_test_samples: 0
  test_start_index: 0
  test_num_samples: 0
  test_only: false
  test_split_prefix: "test2/"
  test_strip_split_prefix: true
  test_bbox_round_decimals: 3

train:
  batch_size: 8
  test_batch_size: 8
  epochs: 20
  num_workers: 4
  show_tqdm: true
  collator_include_raw_inputs: false
  run_test: true
  run_val_metrics: true
  eval_only: false
  lr: 1e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_accum_steps: 8
  max_grad_norm: 1.0
  seed: 42
  device: "cuda"
  dtype: "bfloat16"
  gradient_checkpointing: false

image:
  scene_h: 512
  scene_w: 512

text:
  # NOTE: currently not applied because collator tokenization uses truncation=False.
  max_text_length: 256
  generation_max_new_tokens: 26  # slightly larger to fit "Object: <label text>" in pure-text mode
  generation_num_beams: 3
  object_embedding_dim: 512
  test_retrieval_top_k: 3
  point_decimals: 4

loss:
  # total = w_answer * L_answer_nll + w_object * L_obj_retrieval + w_point_reg * L_point_reg
  # L_answer_nll : full assistant answer autoregressive NLL (main objective).
  # L_obj_retrieval : object span hidden -> CLIP bank retrieval CE (auxiliary).
  # L_point_reg  : point head hidden -> SmoothL1/MSE regression to GT (x, y) (auxiliary).
  # Priority: full-answer NLL > point regression > object retrieval.
  loss_answer_weight: 1.0
  loss_point_weight: 0.0    # point tokens CE — already covered by full answer NLL
  loss_object_weight: 0.5   # retrieval auxiliary; keep low so NLL stays primary
  loss_slot_weight: 0.0     # no <obj_emb> slot token in pure-text mode
  loss_point_reg_weight: 2.0  # point head regression loss weight
  point_reg_loss_type: "mse"  # "smooth_l1" or "mse"
  object_loss_mode: "retrieval"
  object_temperature: 0.07
  loss_use_lm_fallback: false

point_head:
  point_head_enabled: true
  point_head_hidden_dim: 256
  point_head_num_hidden_layers: 3

prompt:
  prompt_template: ""
  visual_prompting: true
  prompt_text: |
    Given the highlighted subject, estimate the gaze point and the object being looked at.
    Subject head bbox [xmin,ymin,xmax,ymax] (normalized): [{xmin:.6f}, {ymin:.6f}, {xmax:.6f}, {ymax:.6f}]
    Output EXACTLY two lines in this exact format:
    Point: x y
    Object: <object name>
    Do not output any extra text, symbols, or lines.
  answer_template: "Point: {point_x} {point_y}\nObject: {label_text}"
  fallback_target_text: "unknown"

lora:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_bias: "none"
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

runtime:
  attn_implementation: "sdpa"

wandb:
  enabled: true
  project: "gaze_mllm"
  entity: "semgaze"
  run_name: "qwen_ge"
  wandb_log_every_steps: 20
  tags: []
  notes: ""
