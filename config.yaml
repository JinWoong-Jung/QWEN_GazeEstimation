paths:
  model_path: "model/Qwen3-VL-4B-Instruct"
  output_dir: "checkpoints"
  image_root: "data/gazefollow_extended/train"
  train_ann: "data/gazefollow/train_annotations_new.txt"
  val_ann: "data/gazefollow/val_annotations_new.txt"
  test_ann: "data/gazefollow_extended/test_annotations_release.txt"
  test_image_root: "data/gazefollow_extended/test2"
  train_labels: "data/gazefollow/gaze-labels-train.csv"
  val_labels: "data/gazefollow/gaze-labels-val.csv"
  test_labels: "data/gazefollow/gaze-labels-test.csv"
  labels_rgs: "data/gazefollow/gaze-labels-rgs.csv"
  labels_ssa: "data/gazefollow/gaze-labels-ssa.csv"
  vocab2id: "data/gazefollow/vocab2id.json"
  label_embed_dir: "data/gazefollow/label-embeds_new"

data:
  scene_h: 512
  scene_w: 512
  image_cache_size: 1000
  split_prefix: "train/"
  strip_split_prefix: true
  test_split_prefix: "test2/"
  test_strip_split_prefix: true
  test_bbox_round_decimals: 3

train:
  seed: 42
  device: "cuda"
  dtype: "bfloat16"
  gradient_checkpointing: false
  epochs: 10
  batch_size: 8
  grad_accum_steps: 8
  num_workers: 4
  lr: 1e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0

eval:
  test_batch_size: 8
  show_tqdm: true
  eval_only: false
  test_only: false
  run_test: true
  run_val_metrics: true
  run_val_metrics_every_n_epochs: 1
  checkpoint_monitor: "val_dist"  # val_loss | val_dist | val_acc@1 | val_acc@3 | val_multiacc@1
  checkpoint_monitor_mode: "auto"  # auto | min | max
  generation_max_new_tokens: 26   # April 9 point path used a slightly longer budget for the two-line answer
  generation_num_beams: 1        # single-pass generation for the two-line answer
  repetition_penalty: 1.15
  no_repeat_ngram_size: 2
  test_retrieval_top_k: 3
  clip_model1_path: "openai/clip-vit-base-patch32"
  object_embedding_dim: 512
  object_temperature: 0.07

prompt:
  visual_prompting: true
  point_decimals: 4
  prompt_template: ""
  answer_template: "Point:{point_x},{point_y}\nObject:{label_text}"
  fallback_target_text: "unknown"
  prompt_text: |
    Given the highlighted subject, estimate the gaze point and the object being looked at.
    Subject head bbox [xmin,ymin,xmax,ymax] (normalized): [{xmin:.6f}, {ymin:.6f}, {xmax:.6f}, {ymax:.6f}]
    Predict x and y as normalized coordinates between 0 and 1, each rounded to exactly {point_decimals} decimal places.
    Answer the object as a simple noun or short noun phrase only.
    Output EXACTLY two lines in this exact format:
    Point:x,y
    Object:<object name>
    Do not output any extra text, symbols, or lines.

model:
  attn_implementation: "sdpa"
  max_text_length: 256
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_bias: "none"
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

loss:
  loss_answer_weight: 1.0

wandb:
  enabled: true
  project: "gaze_mllm"
  entity: "semgaze"
  run_name: "baseline"
  wandb_log_every_steps: 20
  tags: []
  notes: ""
