paths:
  model_path: "model/Qwen3-VL-4B-Instruct"
  image_root: "data/gazefollow_extended/train"
  train_ann: "data/gazefollow/train_annotations_new.txt"
  val_ann: "data/gazefollow/val_annotations_new.txt"
  test_ann: "data/gazefollow_extended/test_annotations_release.txt"
  test_image_root: "data/gazefollow_extended/test2"
  train_labels: "data/gazefollow/gaze-labels-train.csv"
  val_labels: "data/gazefollow/gaze-labels-val.csv"
  test_labels: "data/gazefollow/gaze-labels-test.csv"
  vocab2id: "data/gazefollow/vocab2id.json"
  output_dir: "checkpoints/gaze_lora"

data:
  split_prefix: "train/"
  strip_split_prefix: true
  max_train_samples: 0
  max_val_samples: 0
  max_test_samples: 0
  test_split_prefix: "test2/"
  test_strip_split_prefix: true
  test_bbox_round_decimals: 3

train:
  batch_size: 8
  test_batch_size: 8
  epochs: 3
  num_workers: 4
  show_tqdm: true
  run_test: true
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.01
  grad_accum_steps: 8
  max_grad_norm: 1.0
  seed: 42
  device: "cuda"
  dtype: "bfloat16"
  gradient_checkpointing: false

image:
  scene_h: 512
  scene_w: 512
  head_h: 224
  head_w: 224
  heatmap_h: 64
  heatmap_w: 64
  heatmap_sigma: 7.0

model:
  enable_recognition: true
  recognition_objective: "infonce"
  label_emb_dim: 512
  logit_scale_init: 0.07
  label_embed_dir: "data/gazefollow/label-embeds"
  normalize_label_emb: true
  head_tokens: 64
  text_tokens: 64
  max_text_length: 128
  conditioning_mode: "film"
  pool_mode: "mean"
  num_conditioning_heads: 8
  num_conditioning_layers: 1
  dropout: 0.1

loss:
  lambda_cls: 0.01
  label_smoothing: 0.0
  cls_ignore_index: -100
  acc_dist_threshold: 0.15

prompt:
  prompt_template: ""
  prompt_text: |
    Given the highlighted subject, estimate where the subject is looking(normalized gaze point).
    Head bbox [xmin,ymin,xmax,ymax] (normalized): [{xmin:.6f}, {ymin:.6f}, {xmax:.6f}, {ymax:.6f}]
    Important rules:
    1) Predict where the person is looking AT in the scene (target object/location),
    NOT the eye position, face center, or head center.
    2) Coordinates must be in FULL SCENE coordinates, not head-crop coordinates.
    3) Prefer a point on the likely attended object along the gaze direction.
    4) Avoid points inside the head bbox unless no other plausible target is visible.
    
    Output format (one line only): x y
  head_text: "Target subject head crop."

lora:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_bias: "none"
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

runtime:
  attn_implementation: "sdpa"

wandb:
  enabled: true
  project: "gaze_mllm"
  entity: "semgaze"
  run_name: "baseline"
  wandb_log_every_steps: 1
  tags: []
  notes: ""
