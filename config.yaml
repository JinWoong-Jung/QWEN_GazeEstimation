paths:
  model_path: "model/Qwen3-VL-4B-Instruct"
  image_root: "data/gazefollow_extended/train"
  train_ann: "data/gazefollow/train_annotations_new.txt"
  val_ann: "data/gazefollow/val_annotations_new.txt"
  test_ann: "data/gazefollow_extended/test_annotations_release.txt"
  test_image_root: "data/gazefollow_extended/test2"
  train_labels: "data/gazefollow/gaze-labels-train.csv"
  val_labels: "data/gazefollow/gaze-labels-val.csv"
  test_labels: "data/gazefollow/gaze-labels-test.csv"
  labels_rgs: "data/gazefollow/gaze-labels-rgs.csv"
  labels_ssa: "data/gazefollow/gaze-labels-ssa.csv"
  vocab2id: "data/gazefollow/vocab2id.json"
  label_embed_dir: "data/gazefollow/label-embeds"
  output_dir: "checkpoints/qwen_text_only"

data:
  split_prefix: "train/"
  strip_split_prefix: true
  max_train_samples: 0
  max_val_samples: 0
  max_test_samples: 0
  test_start_index: 0
  test_num_samples: 0
  test_only: false
  test_split_prefix: "test2/"
  test_strip_split_prefix: true
  test_bbox_round_decimals: 3

train:
  batch_size: 8
  test_batch_size: 8
  epochs: 10
  num_workers: 4
  show_tqdm: true
  collator_include_raw_inputs: false
  run_test: true
  eval_only: false
  lr: 3e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_accum_steps: 8
  max_grad_norm: 1.0
  seed: 42
  device: "cuda"
  dtype: "bfloat16"
  gradient_checkpointing: false

image:
  scene_h: 512
  scene_w: 512

text:
  # NOTE: currently not applied because collator tokenization uses truncation=False.
  max_text_length: 256
  generation_max_new_tokens: 16
  object_embedding_dim: 512
  test_retrieval_top_k: 3
  point_decimals: 4

loss:
  # total = w_answer * L_answer + w_point * L_point + w_object * L_object
  # L_object: full label bank retrieval CE (InfoNCE).
  # Priority: localization(point) > output format(answer) > object retrieval.
  loss_answer_weight: 0.6
  loss_point_weight: 2.0
  loss_object_weight: 0.5
  object_loss_mode: "retrieval"
  object_temperature: 0.07
  loss_use_lm_fallback: false

prompt:
  prompt_template: ""
  visual_prompting: true
  prompt_text: |
    Given the highlighted subject, estimate gaze point and object embedding slot.
    Subject head bbox [xmin,ymin,xmax,ymax] (normalized): [{xmin:.6f}, {ymin:.6f}, {xmax:.6f}, {ymax:.6f}]
    Output EXACTLY two lines in this exact format:
    Point: x y
    Object: <obj_emb>
    Keep <obj_emb> exactly as-is (fixed marker token).
    Do not output any extra text, symbols, or lines.
  answer_template: |
    Point: {point_x} {point_y}
    Object: <obj_emb>
  fallback_target_text: "unknown"

lora:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_bias: "none"
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

runtime:
  attn_implementation: "sdpa"

wandb:
  enabled: true
  project: "gaze_mllm"
  entity: "semgaze"
  run_name: "qwen_gaze"
  wandb_log_every_steps: 20
  tags: []
  notes: ""
